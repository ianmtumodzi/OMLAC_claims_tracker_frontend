<!-- Wrapper -->
<div class="bg-gray-100 w-full">

  <!-- IF Create Form Is Toggled On -->
  <ng-container *ngIf="showCreateUserForm; else showUserList">
    <app-create-usermanagement (closeForm)="toggleCreateUserForm()"></app-create-usermanagement>
  </ng-container>

  <!-- ELSE Show Table -->
  <ng-template #showUserList>

    <!-- Top Bar -->
    <div class="bg-white w-full border border-gray-300 p-5 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        
        <!-- Search -->
        <div class="relative overflow-x-auto flex justify-start px-1 py-1">
          <form class="w-[400px]">
            <div class="flex items-center bg-white">
              <input
                type="search"
                placeholder="Search users"
                class="flex-1 h-8 px-4 text-sm text-gray-500 border border-gray-200 rounded-l focus:outline-none"
              />
              <button
                type="submit"
                class="flex items-center gap-2 px-4 h-8 text-sm text-white bg-green-700 hover:bg-green-900 rounded-r"
              >
                <svg 
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
                </svg>
                <span>Search</span>
              </button>
            </div>
          </form>
        </div>

        <!-- Buttons -->
        <div class="flex gap-2">
          <!-- Add User -->
          <button (click)="toggleCreateUserForm()"
            class="flex items-center gap-2 h-7 w-28 px-2 bg-green-700 hover:bg-green-800 text-white rounded shadow text-sm font-semibold">
            <svg xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="currentColor"
              stroke="white"
              stroke-width="1"
              viewBox="0 0 20 20">
              <path d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" />
            </svg>
            <span>New User</span>
          </button>

          <!-- Export -->
          <button class="flex items-center gap-2 h-7 px-2 bg-green-700 hover:bg-green-800 text-white rounded shadow text-sm font-semibold">
            <svg xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5"
              viewBox="0 0 25 25"
              fill="none"
              stroke="white"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <path d="M14 2v6h6" />
              <path d="M8 10l4 4m0-4l-4 4" />
            </svg>
            <span>Export</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="relative overflow-x-auto bg-white border border-gray-200 mt-3 p-3">
      <table class="w-full text-sm text-left text-gray-500">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50">
          <tr >
            <th scope="col" class="px-6 py-3">User ID</th>
            <th scope="col" class="px-6 py-3">First Name</th>
            <th scope="col" class="px-6 py-3">Last Name</th>
            <th scope="col" class="px-6 py-3">Email</th>
            <th scope="col" class="px-6 py-3">Role</th>
            <th scope="col" class="px-6 py-3">Status</th>
            <th scope="col" class="px-6 py-3 text-center">Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let user of users" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
            <td class="px-6 py-3 font-medium text-gray-900">{{ user.id }}</td>
            <td class="px-6 py-3">{{ user.firstName }}</td>
            <td class="px-6 py-3">{{ user.lastName }}</td>
            <td class="px-6 py-3">{{ user.email }}</td>
            <td class="px-6 py-3">{{ user.role }}</td>
            <td class="px-6 py-3">
              <span class="px-2 py-1 text-xs font-semibold rounded-full"
                    [ngClass]="user.active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                {{ user.active ? 'Active' : 'Inactive' }}
              </span>
            </td>

            <!-- Action Buttons -->
            <td class="px-6 py-3 text-center flex justify-center gap-3">

              <!-- Edit Button -->
              <button title="Edit"
                class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium text-blue-700 bg-blue-100 rounded hover:bg-blue-200 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.232 5.232l3.536 3.536M9 11l6 6M3 21v-3.586a1 1 0 01.293-.707l11-11a1 1 0 011.414 0l2.586 2.586a1 1 0 010 1.414l-11 11A1 1 0 007.586 21H3z" />
                </svg>
                Edit
              </button>

              <!-- Delete Button -->
              <button title="Delete"
                class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium text-red-700 bg-red-100 rounded hover:bg-red-200 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6 18L18 6M6 6l12 12" />
                </svg>
                Delete
              </button>

            </td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination -->
      <nav class="flex items-center justify-between pt-4" aria-label="User navigation">
        <span class="text-sm text-gray-500">
          Showing <span class="font-semibold text-gray-900">1–7</span> of <span class="font-semibold text-gray-900">120</span>
        </span>
        <ul class="inline-flex -space-x-px text-sm h-8">
          <li><a href="#" class="flex items-center justify-center px-3 h-8 text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100">Prev</a></li>
          <li><a href="#" class="flex items-center justify-center px-3 h-8 text-blue-600 border border-gray-300 bg-blue-50 hover:bg-blue-100">1</a></li>
          <li><a href="#" class="flex items-center justify-center px-3 h-8 text-gray-500 bg-white border border-gray-300 hover:bg-gray-100">2</a></li>
          <li><a href="#" class="flex items-center justify-center px-3 h-8 text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100">Next</a></li>
        </ul>
      </nav>
    </div>

  </ng-template>
</div>
