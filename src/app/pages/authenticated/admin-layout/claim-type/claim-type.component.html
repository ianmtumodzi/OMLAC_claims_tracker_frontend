<!-- Section Header -->
<div class="flex flex-wrap items-center justify-between bg-white border border-gray-300 p-4 rounded-t-md shadow-sm">
  <h2 class="text-lg font-semibold text-gray-800">Claim Type</h2>

  <div class="flex flex-wrap gap-2">
    <!-- Search -->
    <form class="flex items-center">
      <input
        type="text"
        placeholder="Search"
        class="border border-gray-300 text-sm rounded-l px-3 py-1 focus:ring-1 focus:ring-green-600 focus:outline-none"
      />
      <button
        type="submit"
        class="bg-green-700 hover:bg-green-800 text-white px-3 py-1 rounded-r text-sm flex items-center gap-1"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
        </svg>
        Search
      </button>
    </form>

    <!-- New Claim Type Button -->
    <button
      class="bg-green-700 hover:bg-green-800 text-white text-sm px-3 py-1 rounded flex items-center gap-1"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
        <path
          d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
        />
      </svg>
      New Claim Type
    </button>
  </div>
</div>
