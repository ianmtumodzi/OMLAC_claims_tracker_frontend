<header class="bg-white shadow-md h-20 flex items-center justify-between px-6">
  <!-- Logo -->
  <div class="text-2xl font-bold text-green-600">OMLAC Retail Claims Track</div>

  <!-- Right side icons -->
  <div class="flex items-center space-x-4">
    <!-- Notification bell -->
    <button class="relative text-gray-600 hover:text-blue-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 17h5l-1.405-1.405C18.215 15.21 18 14.36 18 13.5V11a6.002 
                   6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 
                   6 11v2.5c0 .86-.215 1.71-.595 2.095L4 17h5m6 0v1a3 3 
                   0 11-6 0v-1m6 0H9">
        </path>
      </svg>
      <span class="absolute top-0 right-0 inline-block w-2 h-2 bg-red-500 rounded-full"></span>
    </button>

    <!-- User avatar button -->
<div class="relative">
  <button (click)="toggleModal()" class="flex items-center space-x-2 focus:outline-none">
    <div class="w-8 h-8 rounded-full bg-green-600 text-white flex items-center justify-center font-semibold text-xs">
      IM
    </div>
    <span class="text-sm text-gray-700">Ian Mtumodzi</span>
  </button>

  <!-- Modal popup -->
  <div
    *ngIf="showModal"
    class="absolute right-0 mt-2 w-55 bg-white border border-gray-200 rounded-lg shadow-xl z-50 p-4 space-y-3"
  >
    <!-- Header row with title and close icon -->
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-lg font-semibold text-gray-800">Account</h2>
      <button
        (click)="closeModal()"
        class="text-gray-400 hover:text-gray-700 p-1 rounded-full focus:outline-none"
        aria-label="Close"
      >
        <!-- Heroicons X (close icon) -->
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <button (click)="onProfileClick()" class="w-full bg-gray-100 text-gray-800 px-4 py-2 rounded hover:bg-gray-200 text-sm">
      Upload Profile
    </button>

    <button (click)="onLogoutClick()" class="w-full mb-4 bg-red-100 text-red-700 px-4 py-2 rounded hover:bg-red-200 text-sm">
      Sign out
    </button>
  </div>
</div>

  </div>
</header>
