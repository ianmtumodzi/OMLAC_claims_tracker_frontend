<div class="max-w-6xl mx-auto mt-10 bg-white border border-gray-300 rounded-xl shadow-md overflow-hidden">
  <!-- Header -->
  <div class="w-full bg-white border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700 flex items-center gap-2 px-6 py-4">
    <svg xmlns="http://www.w3.org/2000/svg" 
         fill="none" 
         viewBox="0 0 24 24" 
         stroke-width="3" 
         stroke="currentColor" 
         class="w-5 h-5 text-green-600">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
    </svg>
    <h2 class="text-lg font-semibold text-green-700 dark:text-green-400">
      New User
    </h2>
  </div>

  <!-- Form -->
  <form class="space-y-4 p-8">
    <!-- Name Fields -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-600">First Name</label>
        <input
          type="text"
          placeholder="Enter first name"
          class="mt-2 block w-full border border-gray-300 px-3 py-2 text-gray-900 rounded placeholder-gray-400 focus:outline-none focus:ring-green-600 focus:border-green-600"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-600">Last Name</label>
        <input
          type="text"
          placeholder="Enter last name"
          class="mt-2 block w-full border border-gray-300 px-3 py-2 text-gray-900 rounded placeholder-gray-400 focus:outline-none focus:ring-green-600 focus:border-green-600"
        />
      </div>
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-600">Email</label>
      <input
        type="email"
        placeholder="Enter email"
        class="mt-2 block w-full border border-gray-300 px-3 py-2 text-gray-900 rounded placeholder-gray-400 focus:outline-none focus:ring-green-600 focus:border-green-600"
      />
    </div>

    <!-- Passwords -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-600">Password</label>
        <input
          type="password"
          placeholder="Enter password"
          class="mt-2 block w-full border border-gray-300 px-3 py-2 text-gray-900 rounded placeholder-gray-400 focus:outline-none focus:ring-green-600 focus:border-green-600"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600">Confirm Password</label>
        <input
          type="password"
          placeholder="Confirm password"
          class="mt-2 block w-full border border-gray-300 px-3 py-2 text-gray-900 rounded placeholder-gray-400 focus:outline-none focus:ring-green-600 focus:border-green-600"
        />
      </div>
    </div>

    <!-- Dropdowns -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

  <!-- Status -->
  <div class="relative">
    <label class="block text-sm font-medium text-gray-500 mb-1">Status</label>
    <select
      onchange="this.classList.remove('text-gray-500')"
      class="appearance-none mt-3 block w-full border border-gray-300 px-3 py-1 pr-10 text-gray-500 focus:outline-none focus:ring-green-500 focus:border-green-500"
    >
      <option value="" disabled selected>Select status</option>
      <option>Active</option>
      <option>Inactive</option>
    </select>
    <div class="pointer-events-none absolute right-3 top-[calc(65%+0.5rem)] transform -translate-y-1/2">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </div>
  </div>

  <!-- Role -->
  <div class="relative">
    <label class="block text-sm font-medium text-gray-500 mb-1">Role</label>
    <select
      onchange="this.classList.remove('text-gray-500')"
      class="appearance-none mt-3 block w-full border border-gray-300 px-3 py-1 pr-10 text-gray-500 focus:outline-none focus:ring-green-500 focus:border-green-500"
    >
      <option value="" disabled selected>Select role</option>
      <option>Admin</option>
      <option>View & Edit</option>
      <option>View Only</option>
    </select>
    <div class="pointer-events-none absolute right-3 top-[calc(65%+0.5rem)] transform -translate-y-1/2">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </div>
  </div>

  <!-- Business Unit -->
  <div class="relative">
    <label class="block text-sm font-medium text-gray-500 mb-1">Business Unit</label>
    <select
      onchange="this.classList.remove('text-gray-500')"
      class="appearance-none mt-3 block w-full border border-gray-300 px-3 py-1 pr-10 text-gray-500 focus:outline-none focus:ring-green-500 focus:border-green-500"
    >
      <option value="" disabled selected>Select business unit</option>
      <option>Corporate</option>
      <option>Retail</option>
      <option>Operations</option>
      <option>Finance</option>
    </select>
    <div class="pointer-events-none absolute right-3 top-[calc(65%+0.5rem)] transform -translate-y-1/2">
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </div>
  </div>

</div>


    <!-- Buttons -->
    <div class="mt-8 flex justify-between items-center">
      <button
        type="submit"
        class="flex items-center gap-2 bg-green-700 text-white px-5 py-1 rounded-md hover:bg-green-800 transition"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 22 22">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" />
          <polyline points="7 3 7 8 15 8" />
        </svg>
        <span>Save</span>
      </button>

      <button
        type="button"
        class="flex items-center gap-2 bg-red-200 text-red-700 px-4 py-1 rounded-md hover:bg-red-300 transition"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 25 25">
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
        <span>Cancel</span>
      </button>
    </div>
  </form>
</div>
