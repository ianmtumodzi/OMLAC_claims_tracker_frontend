<aside id="logo-sidebar" class="relative top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0" aria-label="Sidebar">
  <div class="h-full px-3 py-4 overflow-y-auto bg-green-700">
    <ul class="space-y-2 font-medium mt-8">

      <!-- Dashboard -->
      <li>
        <a routerLink="/admin-layout"
           [ngClass]="{'bg-white text-green-600 font-semibold before:absolute before:left-0 before:h-full before:w-1 before:bg-green-600': isActive('/admin-layout'), 'text-white': !isActive('/admin-layout')}"
           class="flex items-center p-2 rounded-lg hover:bg-gray-900 relative">
          <!-- Home icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 me-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M13 5v6h6M5 10v10h14V10"/>
          </svg>
          <span class="ms-3">Dashboard</span>
        </a>
      </li>

      <!-- All Claims -->
      <li>
        <a routerLink="/admin-layout/claims"
           [ngClass]="{'bg-white text-green-600 font-semibold before:absolute before:left-0 before:h-full before:w-1 before:bg-green-600': isActive('/admin-layout/claims'), 'text-white': !isActive('/admin-layout/claims')}"
           class="flex items-center p-2 rounded-lg hover:bg-gray-900 relative">
          <!-- Clipboard List icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 me-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 104 0M9 5V3h6v2"/>
          </svg>
          <span class="ms-3">All Claims</span>
        </a>
      </li>

      <!-- Reports -->
      <li>
        <a routerLink="/admin-layout/reports"
           [ngClass]="{'bg-white text-green-600 font-semibold before:absolute before:left-0 before:h-full before:w-1 before:bg-green-600': isActive('/admin-layout/reports'), 'text-white': !isActive('/admin-layout/reports')}"
           class="flex items-center p-2 rounded-lg hover:bg-gray-900 relative">
          <!-- Chart Bar icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 me-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v18h18M9 18v-6m4 6v-12m4 12V9"/>
          </svg>
          <span class="ms-3">Reports</span>
        </a>
      </li>

      <!-- User Management -->
      <li>
        <a routerLink="/admin-layout/usermanagement"
           [ngClass]="{'bg-white text-green-600 font-semibold before:absolute before:left-0 before:h-full before:w-1 before:bg-green-600': isActive('/admin-layout/usermanagement'), 'text-white': !isActive('/admin-layout/usermanagement')}"
           class="flex items-center p-2 rounded-lg hover:bg-gray-900 relative">
          <!-- Users icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 me-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87M16 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <span class="ms-3">User Management</span>
        </a>
      </li>

      <!-- Claim Type -->
      <li>
        <a routerLink="/admin-layout/claim-type"
           [ngClass]="{'bg-white text-green-600 font-semibold before:absolute before:left-0 before:h-full before:w-1 before:bg-green-600': isActive('/admin-layout/claim-type'), 'text-white': !isActive('/admin-layout/claim-type')}"
           class="flex items-center p-2 rounded-lg hover:bg-gray-900 relative">
          <!-- Clipboard icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 me-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 2h6a2 2 0 012 2v16a2 2 0 01-2 2H9a2 2 0 01-2-2V4a2 2 0 012-2z"/>
          </svg>
          <span class="ms-3">Claim Type</span>
        </a>
      </li>

      <!-- Product Type -->
      <li>
        <a routerLink="/admin-layout/product-type"
           [ngClass]="{'bg-white text-green-600 font-semibold before:absolute before:left-0 before:h-full before:w-1 before:bg-green-600': isActive('/admin-layout/product-type'), 'text-white': !isActive('/admin-layout/product-type')}"
           class="flex items-center p-2 rounded-lg hover:bg-gray-900 relative">
          <!-- Box icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 me-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9l9-5 9 5v11a1 1 0 01-1 1H4a1 1 0 01-1-1V9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 22V12h6v10"/>
          </svg>
          <span class="ms-3">Product Type</span>
        </a>
      </li>

      <!-- Business Unit -->
      <li>
        <a routerLink="/admin-layout/business-unit"
           [ngClass]="{'bg-white text-green-600 font-semibold before:absolute before:left-0 before:h-full before:w-1 before:bg-green-600': isActive('/admin-layout/business-unit'), 'text-white': !isActive('/admin-layout/business-unit')}"
           class="flex items-center p-2 rounded-lg hover:bg-gray-900 relative">
          <!-- Building icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 me-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21V7a2 2 0 012-2h14a2 2 0 012 2v14H3z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 21V10h6v11"/>
          </svg>
          <span class="ms-3">Business Unit</span>
        </a>
      </li>

      <!-- Approvals -->
      <li>
        <a routerLink="/admin-layout/approvals"
           [ngClass]="{'bg-white text-green-600 font-semibold before:absolute before:left-0 before:h-full before:w-1 before:bg-green-600': isActive('/admin-layout/approvals'), 'text-white': !isActive('/admin-layout/approvals')}"
           class="flex items-center p-2 rounded-lg hover:bg-gray-900 relative">
          <!-- Check icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 me-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          <span class="ms-3">Approvals</span>
        </a>
      </li>

    </ul>
  </div>
</aside>
