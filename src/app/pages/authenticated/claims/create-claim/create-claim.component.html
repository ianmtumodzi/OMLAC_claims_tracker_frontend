<div class="container mx-auto max-w-6.5xl rounded p-8 border border-gray-300  bg-white">
  <form class="space-y-4 p-6">
    <h2 class="text-xl font-bold text-gray-600">New Claim</h2>

    <!-- Claim Details -->
    <div class="grid grid-cols-1 gap-6">
      <!-- Fullname -->
      <div class="w-full pr-6 relative overflow-x-auto">
        <label class="block text-sm font-medium text-gray-500">Fullname</label>
        <input
          type="text"
          placeholder="Enter full name"
          class="mt-3 block w-1/3 border border-gray-300 px-3 py-1 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500"
        />
      </div>

      <!-- Policy Number, Product Type, Claim Type -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
        <!-- Policy Number -->
        <div>
          <label class="block text-sm font-medium text-gray-500">Policy Number</label>
          <input
            type="text"
            placeholder="e.g(7700444778)"
            class="mt-3 block w-full border border-gray-300 px-3 py-1 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500"
          />
        </div>

        <!-- Product Type -->
        <div class="relative">
          <label class="block text-sm font-medium text-gray-500 mb-1">Product Type</label>
          <select
            id="productType"
            onchange="this.classList.remove('text-gray-500')"
            class="appearance-none mt-3 block w-full border border-gray-300 px-3 py-1 pr-10 text-gray-500 focus:outline-none focus:ring-green-500 focus:border-green-500"
          >
            <option value="" disabled selected>Select product type</option>
            <option value="life">Savings</option>
            <option value="health">Greenlife</option>
            <option value="general">Mthunzi</option>
          </select>
          <div class="pointer-events-none absolute right-3 top-[calc(65%+0.5rem)] transform -translate-y-1/2">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
                 viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </div>
        </div>

        <!-- Claim Type -->
        <div class="relative">
          <label class="block text-sm font-medium text-gray-500 mb-1">Claim Type</label>
          <select
            id="claimType"
            onchange="this.classList.remove('text-gray-500')"
            class="appearance-none mt-3 block w-full border border-gray-300 px-3 py-1 pr-10 text-gray-500 focus:outline-none focus:ring-green-500 focus:border-green-500"
          >
            <option value="" disabled selected>Select Claim Type</option>
            <option value="life">Full disinvestment</option>
            <option value="health">Refund</option>
            <option value="general">Part Withdrawal</option>
            <option value="general">Cool Off</option>
            <option value="general">Full Surrender</option>
            <option value="general">Part Surrender</option>
          </select>
          <div class="pointer-events-none absolute right-3 top-[calc(65%+0.5rem)] transform -translate-y-1/2">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
                 viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Submission Section -->
    <h3 class="text-xl font-bold text-gray-600 mt-10">Submission</h3>

    <!-- Submitted By -->
    <div class="w-full pr-6 relative overflow-x-auto">
      <label class="block text-sm font-medium text-gray-500">Submitted by</label>
      <input
        type="text"
        placeholder="Enter your name"
        class="mt-3 block w-1/3 border border-gray-300 px-3 py-1 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500"
      />
    </div>

    <!-- Intimation Date, Office, Channel -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
      <!-- Intimation Date -->
      <div class="relative">
        <label class="block text-sm font-medium text-gray-500">Intimation Date</label>
        <input
          type="date"
          id="intimationDate"
          class="mt-3 block w-full border border-gray-300 px-3 py-1 focus:outline-none focus:ring-green-500 focus:border-green-500 text-gray-500"
          onchange="this.classList.toggle('text-gray-900', !!this.value); this.classList.toggle('text-gray-500', !this.value);"
        />
      </div>

      <!-- Office -->
      <div class="relative">
        <label class="block text-sm font-medium text-gray-500 mb-1">Office</label>
        <select
          id="office"
          onchange="this.classList.remove('text-gray-500')"
          class="appearance-none mt-3 block w-full border border-gray-300 px-3 py-1 pr-10 text-gray-500 focus:outline-none focus:ring-green-500 focus:border-green-500"
        >
          <option value="" disabled selected>Select office</option>
          <option>Lilongwe</option>
          <option>Blantyre</option>
          <option>Mzuzu</option>
          <option>Zomba</option>
          <option>Kasungu</option>
          <option>Mangochi</option>
        </select>
        <div class="pointer-events-none absolute right-3 top-[calc(65%+0.5rem)] transform -translate-y-1/2">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </div>
      </div>

      <!-- Channel -->
      <div class="relative">
        <label class="block text-sm font-medium text-gray-500 mb-1">Channel</label>
        <select
          id="channel"
          onchange="this.classList.remove('text-gray-500')"
          class="appearance-none mt-3 block w-full border border-gray-300 px-3 py-1 pr-10 text-gray-500 focus:outline-none focus:ring-green-500 focus:border-green-500"
        >
          <option value="" disabled selected>Select channel</option>
          <option>Email</option>
          <option>Phone</option>
          <option>Walk-in</option>
        </select>
        <div class="pointer-events-none absolute right-3 top-[calc(65%+0.5rem)] transform -translate-y-1/2">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="mt-8 flex justify-between items-center">
      <!-- Save -->
      <button
        type="submit"
        class="flex items-center gap-2 bg-green-700 text-white h-7 w-22 px-2 py-2 rounded-sm hover:bg-green-900 transition"
      >
        <svg
          class="w-5 h-4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 22 22"
        >
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" />
          <polyline points="7 3 7 8 15 8" />
        </svg>
        <span class="font-normal">Save</span>
      </button>

      <!-- Cancel -->
      <button
        type="button"
        (click)="onClose()"
        class="flex items-center gap-2 bg-red-200 text-red-700 h-7 w-22 px-2 py-2 rounded-sm hover:bg-red-300 transition"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 25 25">
          <path d="M6 18L18 6M6 6l12 12" />
        </svg>
        <span class="font-normal">Cancel</span>
      </button>
    </div>
  </form>
</div>
