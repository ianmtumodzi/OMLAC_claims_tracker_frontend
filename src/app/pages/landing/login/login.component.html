<section class="min-h-screen flex">
  <!-- Left Column - Branding -->
  <div class="hidden lg:flex w-1/2 bg-green-700 items-center justify-center p-8">
    <div class="text-center text-white max-w-md">
      <h1 class="text-4xl font-bold mb-4">OLD MUTUAL</h1>
      <p class="text-xl mb-8">Welcome!</p>
      <p class="text-2xl font-medium">OMLAC Claims tracker</p>
    </div>
  </div>

  <!-- Right Column - Login Form -->
  <div class="w-full lg:w-1/2 bg-gray-100 flex items-center justify-center p-6">
    <div class="w-full max-w-md">
      <!-- Mobile Header (hidden on desktop) -->
      <div class="mb-8 text-center lg:hidden">
        <h1 class="text-3xl font-bold text-green-700 mb-2">OLD MUTUAL</h1>
        <p class="text-gray-600">Claims Tracker</p>
      </div>

      <!-- Login Card -->
      <div class="bg-white p-8 rounded-lg shadow-sm">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6">Sign in to your account</h2>

        <form class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
            <input
              type="email"
              id="email"
              placeholder="name@oldmutual.co.com"
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"

            >
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
            >
          </div>

          <div class="flex justify-end">
            <a href="#" class="text-sm text-green-600 hover:text-green-800">Forgot password?</a>
          </div>

          <button
            type="submit"
            (click)="onButtonClick()"
            class="w-full bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-md transition duration-200 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2"
          >
            Login
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
